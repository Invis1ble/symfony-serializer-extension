name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      -
        name: Build Docker images
        uses: docker/bake-action@v7.4.0
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      -
        name: Start services
        run: docker compose up --wait --no-build
        env:
          XDEBUG_MODE: coverage
      -
        name: Install Dependencies
        run: docker compose exec -T php composer install -vvv --no-ansi --no-interaction
      -
        name: Check Code Quality via PHP_CodeSniffer
        run: docker compose exec -T php bin/php_codesniffer
      -
        name: Check Code Quality via PHP-CS-Fixer
        run: docker compose exec -T php bin/php-cs-fixer
      -
        name: Rector Cache
        uses: actions/cache@v6.1.0
        with:
          path: var/cache/rector
          key: ${{ runner.os }}-rector-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-rector-
      -
        run: mkdir -p var/cache/rector
      -
        name: Rector Dry Run
        run: docker compose exec -T php bin/rector
      -
        name: Execute tests via PHPUnit
        run: docker compose exec -T php vendor/bin/phpunit --coverage-clover var/log/coverage-clover.xml
      -
        name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: var/log/coverage-clover.xml
          fail_ci_if_error: true
  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7.0.1
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
